services:
  api:
    image: mcr.microsoft.com/dotnet/sdk:5.0
    working_dir: /app
    volumes:
      - .:/app
      - nuget_cache:/root/.nuget/packages
    command: ["sh", "-c", "dotnet restore && exec dotnet watch --project JobTracker.Api.csproj run --no-launch-profile"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER=1
    ports:
      - "8000:5000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/weatherforecast"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    image: node:18
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    command: ["sh", "-c", "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0"]
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  nuget_cache:
  frontend_node_modules:
